[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Keep the local audit runtime small; Solana's test runtime has a large dependency graph.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

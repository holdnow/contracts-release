[package]
name = "holdnow"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "holdnow"

[features]
default = []
devnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "associated_token", "token_2022", "solana-v4"] }
solana-program = "=4.0.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
[dev-dependencies]
solana-program-test = { version = "=4.3.2", features = ["agave-unstable-api"] }
solana-sdk = "=4.0.1"
solana-compute-budget-interface = "3.0"
spl-token = { package = "spl-token-interface", version = "=3.0.0" }
spl-associated-token-account = { package = "spl-associated-token-account-interface", version = "=2.0.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"

serde_json = "1"
bincode = "1.3.3"
solana-address-lookup-table-program = { package = "solana-address-lookup-table-interface", version = "=3.2.0", features = ["bincode", "bytemuck"] }
